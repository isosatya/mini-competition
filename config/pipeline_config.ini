[GENERAL]
# Mode: basic (original implementation) or enhanced (improved implementation)
mode = enhanced
# Stages to run (comma-separated): preprocess, feature_engineering, model_training, model_evaluation
run_stages = preprocess,feature_engineering,model_training,model_evaluation

[PATHS]
# Directory containing raw input data files
raw_data_dir = data/raw
# Directory for storing processed data and intermediary results
processed_data_dir = data/processed
# Directory for storing trained models
models_dir = models
# Directory for storing pipeline run results
results_dir = results

[PREPROCESSING]
# Method for imputing missing values: mean, median, seasonal
imputation_method = seasonal
# Whether to detect and handle outliers
handle_outliers = true
# Method for outlier detection: isolation_forest, zscore, iqr
outlier_method = isolation_forest
# Whether to apply transformations for stationarity
apply_transformations = true

[FEATURE_ENGINEERING]
# Whether to create extended lag features
extended_lag_features = true
# Maximum number of weeks for lag features
max_lag_weeks = 12
# Whether to create interaction terms between features
create_interaction_terms = true
# Whether to create features for cumulative precipitation
create_cumulative_precip = true
# Whether to create autoregressive features
create_autoregressive_features = true
# Whether to create enhanced cyclic features
create_enhanced_cyclic = true

[MODEL_TRAINING]
# Models to train (comma-separated): random_forest, xgboost, lightgbm, time_series, negative_binomial, ensemble
models = random_forest,xgboost,lightgbm,time_series,negative_binomial,ensemble
# Whether to train city-specific models
city_specific_models = true
# Random seed for reproducibility
random_seed = 42
# Method for time series validation: time_series_split, expanding_window
validation_method = time_series_split
# Number of splits for time series cross-validation
n_splits = 5
# Whether to save trained models
save_models = true

[EVALUATION]
# Percentile threshold for defining outbreaks
outbreak_percentile = 75
# Weight for outbreak periods in weighted metrics
outbreak_penalty_weight = 2.0
# Whether to generate visualizations
generate_visualizations = true
# Whether to save feature importance analysis
save_feature_importance = true
# Whether to use specialized outbreak detection metrics
use_outbreak_metrics = true
# Whether to generate city-specific metrics
city_specific_metrics = true